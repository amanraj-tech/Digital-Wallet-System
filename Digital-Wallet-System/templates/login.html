<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — PocketPay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand-lockup"><span class="brand-symbol" aria-hidden="true"><span></span></span><div class="brand-mark">Pocket<span>Pay</span></div></div>
      <div class="brand-tag">Your everyday wallet, thoughtfully simple.</div>

      <div id="banner"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="pin">4-digit PIN</label>
          <input type="password" id="pin" inputmode="numeric" maxlength="4" required autocomplete="current-password" />
        </div>
        <button class="btn" type="submit" style="width:100%">Log in</button>
      </form>

      <div class="auth-switch">
        New here? <a href="/register">Create a wallet</a>
      </div>

      <p style="margin-top:22px; font-size:0.78rem; color:#8FA0AC;">
        Demo accounts: alice@example.com / 1111, bob@example.com / 2222, carol@example.com / 3333
      </p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script>
    const form = document.getElementById("login-form");
    const banner = document.getElementById("banner");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      banner.innerHTML = "";
      const email = document.getElementById("email").value.trim();
      const pin = document.getElementById("pin").value.trim();
      try {
        await api.post("/api/login", { email, pin });
        window.location.href = "/dashboard";
      } catch (err) {
        banner.innerHTML = `<div class="banner error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
